const ICONS={grid:'M3 3h6v6H3z M15 3h6v6h-6z M3 15h6v6H3z M15 15h6v6h-6z',calendar:'M5 5h14a2 2 0 0 1 2 2v13H3V7a2 2 0 0 1 2-2 M7 3v4 M17 3v4 M3 10h18 M7 14h3 M14 14h3',map:'M3 5l6-2 6 2 6-2v16l-6 2-6-2-6 2z M9 3v16 M15 5v16',clock:'M12 8v5l3 2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',pin:'M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0 M15 10a3 3 0 1 1-6 0 3 3 0 0 1 6 0',arrow:'M5 12h14 M14 7l5 5-5 5',check:'M5 12l4 4L19 6',back:'M19 12H5 M10 7l-5 5 5 5',building:'M5 21V3h14v18 M3 21h18 M9 7h1 M14 7h1 M9 11h1 M14 11h1 M10 21v-5h4v5',leaf:'M20 3c0 12-4 17-10 15C2 16 4 7 20 3 M6 20L16 8',shield:'M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6z M8 12l3 3 5-6',info:'M12 11v6 M12 7h.01 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',play:'M8 4l12 8-12 8z',users:'M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8 M2 21v-2a6 6 0 0 1 12 0v2 M16 4a4 4 0 0 1 0 8 M18 15a5 5 0 0 1 4 5',bolt:'M13 2L4 14h7l-1 8 10-13h-7z',close:'M6 6l12 12 M6 18L18 6',reset:'M3 10a9 9 0 1 1 1 8 M3 3v7h7',truck:'M3 5h12v12H3z M15 10h4l3 4v3h-7 M8 18a2 2 0 1 1-4 0 2 2 0 0 1 4 0 M20 18a2 2 0 1 1-4 0 2 2 0 0 1 4 0'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]||ICONS.grid}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROPERTIES={creek:{name:'Creekstone at RTP',area:'Durham · RTP',address:'Durham, North Carolina',source:'https://www.irtliving.com/Apartments/North-Carolina/Durham/Creekstone-At-RTP',verified:'Advertises valet trash and elevators in select buildings.',color:'#dce7d5',layout:'elevator'},trellis:{name:'Trellis Durham RTP',area:'South Durham',address:'201 Residence Inn Boulevard, Durham, NC',source:'https://liveworktru.com/property/trellis-durham-rtp/',verified:'Operator describes 122 apartments across six garden-style buildings.',color:'#e8e5d6',layout:'garden'},retreat:{name:'Retreat at RTP',area:'Durham · Ellis Road',address:'1533 Ellis Road, Durham, NC',source:'https://www.retreatrtp.com/apartments/nc/durham/floor-plans',verified:'Publishes an interactive community site map.',color:'#dde8eb',layout:'garden'}};
const JOBS=[{id:'c1',property:'creek',route:'Illustrative Building A',day:4,start:1200,end:1320,pay:48,minutes:70,units:24,kind:'Elevator',floors:6,perFloor:4,zone:'A',featured:true},{id:'t1',property:'trellis',route:'Illustrative Buildings A–C',day:4,start:1140,end:1260,pay:62,minutes:95,units:18,kind:'Stairs',floors:3,perFloor:6,zone:'A–C'},{id:'r1',property:'retreat',route:'Illustrative Buildings D–F',day:4,start:1260,end:1380,pay:58,minutes:85,units:18,kind:'Stairs',floors:3,perFloor:6,zone:'D–F'},{id:'c2',property:'creek',route:'Illustrative Building A',day:5,start:1200,end:1320,pay:48,minutes:70,units:24,kind:'Elevator',floors:6,perFloor:4,zone:'A'},{id:'t2',property:'trellis',route:'Illustrative Buildings D–F',day:5,start:1140,end:1260,pay:62,minutes:95,units:18,kind:'Stairs',floors:3,perFloor:6,zone:'D–F'},{id:'r2',property:'retreat',route:'Illustrative Buildings A–C',day:5,start:1260,end:1380,pay:58,minutes:85,units:18,kind:'Stairs',floors:3,perFloor:6,zone:'A–C'}];
const STORIES={first:{title:'Reserve and complete a route',subtitle:'Collector job selection, stop records and submission.',steps:['Reserve Building A at Creekstone.','Review the instructions and advance to the service window.','Record outcomes and report an apartment exception.','Submit the route and review its records in Operations.'],message:'Review where information is entered and what each action changes.'},coverage:{title:'Publish and assign a route',subtitle:'Supervisor publication and collector reservation.',steps:['Publish the unassigned route.','Switch to Collector and reserve Building A.','Return to Operations and review the assignment.'],message:'Publication and assignment are separate states.'},routing:{title:'Compare service policies',subtitle:'Required stops for different request distributions.',steps:['Compare standard and scan-required service.','Change the request distribution.','Add a late request and review the cutoff behavior.'],message:'This comparison is separate from job reservations and stop records.'}};
const KEY='fieldwork-demo-v1';
const baseState=()=>({version:1,loggedIn:false,role:'collector',view:'discover',story:'first',day:4,time:1080,bookings:{},outcomes:{},notes:{},published:true,otherAssignments:{},events:[],labDemand:'sparse',late:false,completion:{},stopNotes:{},recordedAt:{},opsDay:4});
// 2. Storage adapter: replace load/save with an API implementation in a future platform.
let storageWarning=false;
const storage={load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.version===1&&typeof s.bookings==='object'&&s.bookings&&typeof s.outcomes==='object'&&s.outcomes?{...baseState(),...s}:baseState()}catch{return baseState()}},save(s){try{localStorage.setItem(KEY,JSON.stringify(s));return true}catch{storageWarning=true;return false}}};
let state=storage.load();let selected=null,floor=1,building='A',drawer=false,filterDay='all',filterArea='all',filterType='all',toolbarVisible=true,toastTimer,modalReturnFocus=null;
const job=id=>JOBS.find(j=>j.id===id);
const property=j=>PROPERTIES[j.property];
const fmt=m=>`${Math.floor(m/60)%12||12}:${String(m%60).padStart(2,'0')} ${m<720?'AM':'PM'}`;
const date=d=>`${d===4?'Wed':'Thu'}, Nov ${d}`;
const currentTime=()=>`Nov ${state.day} · ${fmt(state.time)} ET`;
const windowLabel=j=>`${fmt(j.start)}–${fmt(j.end)}`;
const status=id=>state.bookings[id]?.status||(state.otherAssignments?.[id]?'reserved':null)||((id==='c1'&&!state.published)?'unpublished':'open');
const buildings=j=>j.property==='creek'?['A']:(j.zone==='A–C'?['A','B','C']:['D','E','F']);
const currentBuilding=j=>buildings(j).includes(building)?building:buildings(j)[0];
const floorOf=u=>Number(u.split('-').at(-1)[0]);
const allStops=j=>buildings(j).flatMap(b=>Array.from({length:j.floors},(_,f)=>Array.from({length:j.property==='creek'?4:2},(_,u)=>`${j.property==='creek'?'':b+'-'}${f+1}${String(u+1).padStart(2,'0')}`)).flat());
const visibleStops=j=>allStops(j).filter(u=>floorOf(u)===floor&&(j.property==='creek'||u.startsWith(currentBuilding(j)+'-')));
const requested=(j,id)=>j.property==='creek'?['201','202','501','504'].includes(id):['101','202','301'].includes(id.split('-').at(-1));
const outcome=(id,unit)=>state.outcomes[id]?.[unit]||'pending';
const completedCount=id=>Object.values(state.outcomes[id]||{}).filter(x=>x!=='pending').length;
const issueCount=id=>Object.values(state.outcomes[id]||{}).filter(x=>x==='blocked'||x==='exception').length;
const claimable=j=>status(j.id)==='open'&&(state.day<j.day||state.day===j.day&&state.time<=j.end-j.minutes);
const conflicts=j=>JOBS.some(k=>k.id!==j.id&&state.bookings[k.id]&&status(k.id)!=='completed'&&k.day===j.day&&j.start<k.end+15&&k.start<j.end+15);
function save(){storage.save(state)}
function event(message){state.events.unshift({message,time:currentTime()});state.events=state.events.slice(0,20);save()}
function toast(message){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast">${esc(message)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',4200)}
function go(view){drawer=false;state.view=view;selected=null;floor=1;save();render();window.scrollTo(0,0)}
function pill(text,color=''){return `<span class="pill ${color}"><span class="dot"></span>${esc(text)}</span>`}
function brand(){return `<div class="brand"><span class="brandmark">f<span class="sr-only">Fieldwork</span></span><span>fieldwork<span style="color:#8baa6d">.</span></span></div>`}
// 3. Original vector artwork. Geographic backdrop and all building plans are illustrative.
function landscape(j,large=false){const c=property(j).color;return `<svg viewBox="0 0 500 180" role="img" aria-label="Illustrative apartment buildings"><rect width="500" height="180" fill="${c}"/><path d="M0 145 Q130 110 240 150T500 130V180H0" fill="#c9d7bc"/><path d="M0 167L500 147" stroke="#f6f7ee" stroke-width="17"/>${[55,205,355].map((x,i)=>`<g transform="translate(${x},${25+i%2*18})"><path d="M0 30L43 6l67 20-42 23z" fill="#9bac98"/><path d="M0 30l68 19v81L0 108z" fill="#f8f8ef"/><path d="M68 49l42-23v82l-42 22z" fill="#bdcdb6"/>${[0,1,2].map(r=>[0,1,2].map(col=>`<path d="M${12+col*18} ${46+r*24}l10 3v13l-10-3z" fill="${r===1?'#8fa98a':'#c7d6c2'}"/>`).join('')).join('')}<path d="M27 115V94l14 4v21" fill="#5c8064"/></g>`).join('')}<g fill="#789a6b">${[15,175,330,480].map(x=>`<ellipse cx="${x}" cy="135" rx="14" ry="20"/><rect x="${x-1}" y="140" width="3" height="20" fill="#68815d"/>`).join('')}</g></svg>`}
function areaMap(){return `<svg viewBox="0 0 300 280" role="img" aria-label="Illustrative RTP area map, not for navigation"><rect width="300" height="280" fill="#edf0e4"/><path d="M0 75Q90 40 125 0M205 280Q170 190 300 150" stroke="#dce5ce" stroke-width="50" fill="none"/><path d="M0 190Q90 140 160 180T300 110M80 0Q130 70 95 130T150 280M0 40L300 240" fill="none" stroke="#fff" stroke-width="12"/><path d="M0 190Q90 140 160 180T300 110" fill="none" stroke="#d1d5c9" stroke-width="2"/><path d="M190 0L170 100 200 170 220 280" fill="none" stroke="#cbdde0" stroke-width="18"/><path d="M78 105L125 168 180 115" fill="none" stroke="#7b9c64" stroke-width="2" stroke-dasharray="5 5"/>${[[78,105,'1'],[125,168,'2'],[180,115,'3']].map(([x,y,n])=>`<circle cx="${x}" cy="${y}" r="15" fill="#29634c" stroke="#fff" stroke-width="4"/><text x="${x}" y="${y+4}" text-anchor="middle" fill="white" font-size="11">${n}</text>`).join('')}<g fill="#829174" font-size="9" letter-spacing="1"><text x="37" y="46">DURHAM</text><text x="185" y="226">MORRISVILLE</text><text x="144" y="72">RESEARCH</text><text x="144" y="85">TRIANGLE PARK</text></g><rect x="20" y="244" width="80" height="19" rx="4" fill="white"/><text x="60" y="257" text-anchor="middle" fill="#829174" font-size="8">ILLUSTRATIVE MAP</text></svg>`}
function floorMap(j){const units=visibleStops(j);const cols=units.length/2;return `${j.property!=='creek'?`<div class="tabs" style="margin-bottom:15px" aria-label="Assigned buildings">${buildings(j).map(b=>`<button data-action="building" data-value="${b}" class="${currentBuilding(j)===b?'active':''}" aria-pressed="${currentBuilding(j)===b}">Building ${b}</button>`).join('')}</div>`:''}<div class="floor-layout"><div class="floor-controls">${Array.from({length:j.floors},(_,i)=>j.floors-i).map(f=>`<button data-action="floor" data-value="${f}" class="${floor===f?'active':''}" aria-pressed="${floor===f}">Floor ${f}${allStops(j).some(u=>floorOf(u)===f&&requested(j,u)&&(j.property==='creek'||u.startsWith(currentBuilding(j)+'-')))?'<i class="request-dot"></i>':''}</button>`).join('')}</div><div class="floor-map"><svg viewBox="0 0 520 330" role="img" aria-label="Illustrative floor ${floor}, ${units.length} apartments, ${j.kind==='Elevator'?'elevator':'stairs'} and corridor"><defs><pattern id="map-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e9ede1" stroke-width=".6"/></pattern></defs><rect width="520" height="330" fill="url(#map-grid)"/><rect x="35" y="35" width="450" height="260" rx="7" fill="#fff" stroke="#c7d2bd" stroke-width="3"/><rect x="35" y="137" width="450" height="56" fill="#eaf0e1"/><path d="M95 165H448" stroke="#82a35e" stroke-width="3" stroke-dasharray="7 6"/>${units.map((u,i)=>{const col=i%cols,row=Math.floor(i/cols),w=330/cols,x=145+col*w,y=row?193:35,oc=outcome(j.id,u),done=oc==='collected'||oc==='empty',bad=oc==='blocked'||oc==='exception';return `<g tabindex="0" role="button" data-action="unit" data-value="${u}" aria-label="Apartment ${u}, ${oc}"><rect x="${x}" y="${y}" width="${w}" height="102" fill="${bad?'#fae9e0':done?'#deecd3':requested(j,u)?'#edf4e5':'#fff'}" stroke="#c7d2bd" stroke-width="2"/><text x="${x+w/2}" y="${y+43}" text-anchor="middle" font-size="17" fill="#466040">${u}</text><text x="${x+w/2}" y="${y+64}" text-anchor="middle" font-size="9" fill="#829075">${done?(oc==='collected'?'Collected':'No trash'):bad?(oc==='blocked'?'Blocked access':'Exception'):requested(j,u)?'Trash ready':'Inspect door'}</text><circle cx="${x+w/2}" cy="${row?y:y+102}" r="6" fill="${bad?'#bd7557':done?'#51845a':requested(j,u)?'#82a35e':'#cbd6c2'}" stroke="white" stroke-width="2"/></g>`}).join('')}<rect x="47" y="85" width="77" height="52" rx="4" fill="#dbe5e8" stroke="#b9cbd0"/><text x="85" y="107" text-anchor="middle" font-size="10" fill="#52737c">${j.kind==='Elevator'?'ELEVATOR':'STAIRS'}</text><text x="85" y="123" text-anchor="middle" font-size="10" fill="#52737c">↑ ↓</text><rect x="47" y="194" width="77" height="52" rx="4" fill="#f0f1ea" stroke="#c7d2bd"/><path d="M60 234v-6h12v-6h12v-6h12v-6h12" fill="none" stroke="#8f9d83" stroke-width="2"/><text x="85" y="268" text-anchor="middle" font-size="8" fill="#829075">EXIT STAIRS</text><circle cx="85" cy="165" r="10" fill="#29634c" stroke="white" stroke-width="3"/><text x="260" y="315" text-anchor="middle" font-size="9" fill="#819074">SCHEMATIC ONLY · NOT THE PROPERTY’S ACTUAL FLOOR PLAN</text></svg></div></div><div class="legend"><span><i></i>Entry point</span><span><i style="background:#82a35e"></i>Trash reported ready</span><span><i style="background:#cbd6c2"></i>Inspection required</span></div>`}
// 4. Views
function login(){return `<div class="login"><section class="login-visual">${brand()}<h1>Trash collection<br>work portal</h1><p>Route scheduling and collection records<br>Research Triangle, North Carolina</p><div class="login-map">${landscape(JOBS[0])}</div><div class="login-footer">INTERNAL WORKFLOW DEMO</div></section><section class="login-right"><div class="login-form"><span class="eyebrow muted">FIELDWORK · INTERNAL DEMO</span><h2>Collector sign in</h2><p class="muted">Maya Chen · Approved collector</p><form id="login-form"><label class="field">Email<input type="email" value="maya@example.com" readonly aria-label="Demo collector email"></label><label class="field">Password<input type="password" value="demo-access" readonly aria-label="Demo password"></label><div class="approved">${icon('shield')} Approved collector · Research Triangle, NC</div><button type="submit" class="btn">Enter demo ${icon('arrow')}</button></form><p class="note">No account needed. This is a working concept with simulated jobs and earnings. Changes stay in this browser. Property names are real; service relationships and layouts are illustrative.</p></div></section></div>`}
function shell(content){const nav=state.role==='operator'?[['ops','grid','Coverage board'],['lab','map','Policy comparison']]:[['discover','grid','Available jobs'],['schedule','calendar','My jobs'],['lab','map','Policy comparison']];return `<div class="shell"><aside class="sidebar">${brand()}<div class="brand-sub">COLLECTION MANAGEMENT</div><div class="navlabel">${state.role==='operator'?'OPERATIONS':'COLLECTOR PORTAL'}</div><nav class="nav" aria-label="Main navigation">${nav.map(([v,i,t])=>`<button data-action="nav" data-value="${v}" class="${state.view===v?'active':''}" ${state.view===v?'aria-current="page"':''}>${icon(i)}${t}${v==='schedule'&&Object.values(state.bookings).filter(b=>b.status!=='completed').length?`<span class="count">${Object.values(state.bookings).filter(b=>b.status!=='completed').length}</span>`:''}</button>`).join('')}</nav><div class="sidebar-note"><div class="flex" style="margin-bottom:8px;color:#4e7046">${icon('leaf')} Research Triangle, NC</div>Scheduling and service records.<br>Internal demo.</div><div class="user flex"><div class="avatar">${state.role==='operator'?'JL':'MC'}</div><div><strong>${state.role==='operator'?'Jordan Lee':'Maya Chen'}</strong><small>${state.role==='operator'?'Area supervisor':'Approved collector'}</small></div><button class="btn ghost small" data-action="logout" aria-label="Log out">↗</button></div></aside><div><header class="topbar"><span class="crumb">Workspace <span style="margin:0 10px;color:#b6beb0">/</span> Research Triangle, NC</span><div class="flex"><span class="clock">${currentTime()}</span>${pill('Demo','amber')}${!toolbarVisible?'<button class="btn secondary small" data-action="toolbar">Presenter controls</button>':''}</div></header><main class="main" id="main">${storageWarning?'<div class="inline-info" role="status">Browser storage is unavailable. This session still works, but changes may not survive a reload.</div>':''}${content}</main></div></div>${presenter()}`}
function presenter(){if(!toolbarVisible)return '';return `<div class="scenario-bar"><div class="bar-title">${icon('play')}</div><div class="story-name"><span class="eyebrow muted">DEMO SCENARIO</span><div style="font-size:12px;font-weight:600">${STORIES[state.story].title}</div></div><div class="spacer"></div><button class="btn secondary small" data-action="stories">${icon('play')} Scenarios</button><button class="btn secondary small" data-action="role">${icon('users')} ${state.role==='collector'?'Operations':'Collector'}</button><button class="btn secondary small" data-action="advance">${icon('clock')} Advance time</button><button class="btn secondary small" data-action="inject">${icon('bolt')} Add event</button><button class="btn ghost small" data-action="reset" aria-label="Reset current story">${icon('reset')}</button></div>${drawer?`<section class="story-drawer" aria-label="Presenter story controls"><div class="flex between"><h3>Load a scenario</h3><button class="btn ghost small" data-action="stories" aria-label="Close story controls">${icon('close')}</button></div><p class="muted" style="font-size:12px;margin-top:7px">Loading a scenario resets its jobs, records and clock.</p>${Object.entries(STORIES).map(([id,s],i)=>`<button class="story-option" data-action="story" data-value="${id}"><span class="eyebrow muted">0${i+1} · ${id==='routing'?'FUTURE POLICY':'WORKFLOW'}</span><strong>${s.title}</strong><small>${s.subtitle}</small></button>`).join('')}<div class="divider"></div><strong style="font-size:12px">Scenario steps</strong><ol class="story-steps">${STORIES[state.story].steps.map(s=>`<li>${s}</li>`).join('')}</ol><div class="hint">${STORIES[state.story].message}</div><button class="btn secondary small" data-action="toolbar" style="margin-top:15px">Hide presenter toolbar</button><button class="btn ghost small" data-action="sources" style="margin-top:10px">Property sources & demo assumptions ${icon('info')}</button></section>`:''}`}
function jobCard(j){const p=property(j),s=status(j.id);return `<article class="panel job"><div class="job-art">${landscape(j)}${pill(j.featured?'Single building':j.kind==='Elevator'?'Elevator access':'Building cluster',j.featured?'':'gray')}</div><div class="jobbody"><span class="eyebrow muted">${date(j.day)} · ${fmt(j.start)}</span><h3>${p.name}</h3><span class="location">${p.area}</span><div class="route-name">${j.route}</div><div class="jobmeta"><span>${icon('clock')} ~${j.minutes} min</span><span>${icon('building')} ${j.units} demo units</span><span>${icon('map')} ${j.kind}</span><span>${icon('shield')} Standard service</span></div><div class="jobfoot"><span class="pay">$${j.pay} <small>/ route</small></span><button class="btn secondary small" data-action="detail" data-value="${j.id}">${s==='open'?'View job':'View reservation'} ${icon('arrow')}</button></div></div></article>`}
function discover(){const list=JOBS.filter(j=>claimable(j)&&(filterDay==='all'||String(j.day)===filterDay)&&(filterArea==='all'||j.property===filterArea)&&(filterType==='all'||j.kind===filterType));return `<div class="pagehead"><div class="flex between"><h1>Available jobs</h1><span class="pill gray">RTP, NORTH CAROLINA</span></div><p>Review the service window and assigned area before reserving a route.</p></div><section class="panel hero"><div><span class="eyebrow">OPEN SERVICE WINDOWS</span><h2>Routes available for reservation</h2><p>Each reservation covers the full service window and assigned buildings or floors.</p></div><div class="hero-stat"><strong>${JOBS.filter(claimable).length}</strong><span>routes available</span></div></section><div class="layout"><section><div class="flex between section-title"><h3>Available routes</h3><span class="muted" style="font-size:12px">${list.length} matching routes</span></div><div class="filters"><label class="sr-only" for="filter-day">Day</label><select class="filter" id="filter-day" data-filter="day"><option value="all">All dates</option><option value="4" ${filterDay==='4'?'selected':''}>Wed, Nov 4</option><option value="5" ${filterDay==='5'?'selected':''}>Thu, Nov 5</option></select><label class="sr-only" for="filter-area">Property</label><select class="filter" id="filter-area" data-filter="area"><option value="all">All properties</option>${Object.entries(PROPERTIES).map(([id,p])=>`<option value="${id}" ${filterArea===id?'selected':''}>${p.name}</option>`).join('')}</select><label class="sr-only" for="filter-type">Access</label><select class="filter" id="filter-type" data-filter="type"><option value="all">Any access type</option><option ${filterType==='Elevator'?'selected':''}>Elevator</option><option ${filterType==='Stairs'?'selected':''}>Stairs</option></select></div><div class="jobgrid">${list.map(jobCard).join('')}</div>${!list.length?'<div class="panel empty"><h3>No matching routes</h3><p>Try another date, property, or access type.</p><button class="btn secondary" data-action="clear-filters">Clear filters</button></div>':''}<p class="note">Real RTP property references. Jobs, pay, layouts, and service arrangements are illustrative, not confirmed Butler Plus assignments. <button class="btn ghost small" data-action="sources">View sources</button></p></section><aside class="aside stack"><div class="panel map-panel">${areaMap()}<div class="map-caption"><h3 style="font-size:14px">Property locations</h3><p>Illustrative area map. Use the property instructions for access details.</p><div class="divider" style="margin:14px 0"></div>${Object.values(PROPERTIES).map((p,i)=>`<div style="font-size:11px;margin:7px 0"><span style="color:#719457;margin-right:9px">0${i+1}</span>${p.name}</div>`).join('')}</div></div><div class="hint"><strong>${icon('shield')} Job instructions</strong>Parking, entry, equipment, and disposal instructions are included with every reserved job.</div><div class="pad" style="padding-top:0"><span class="eyebrow muted">SERVICE POLICY</span><p style="font-size:12px;color:var(--muted);margin-top:9px">Route estimates include checking every door. Resident scans help you prepare; they don’t replace inspections under standard service.</p></div></aside></div>`}
function detail(j){const p=property(j),s=status(j.id),reserved=s!=='open'&&s!=='unpublished';return `<button class="btn ghost back" data-action="nav" data-value="${reserved?'schedule':'discover'}">${icon('back')} ${reserved?'My jobs':'Available routes'}</button><div class="pagehead"><div class="flex wrap">${pill(reserved?s==='completed'?'Submitted':s==='active'?'In progress':'Reserved':'Available')}${pill('Standard collection','gray')}</div><h1 class="detail-title">${p.name}</h1><p>${j.route} <span style="margin:0 8px">·</span> ${p.area}</p></div><div class="detail-layout"><div class="stack"><section class="panel pad"><h3>Route scope</h3><div class="stats"><div class="stat"><strong>${j.units}</strong><span>illustrative units</span></div><div class="stat"><strong>~${j.minutes}m</strong><span>planning estimate</span></div><div class="stat"><strong>${j.floors}</strong><span>floors per schematic</span></div><div class="stat"><strong>${j.kind}</strong><span>primary access</span></div></div><p class="muted" style="font-size:13px">Collect bagged household trash from each doorstep and transfer it to the designated on-site disposal point. Check all assigned doors, including those without a resident scan.</p><div class="divider"></div><h3 style="font-size:14px">Included and excluded work</h3><ul class="list"><li>${icon('check')} Assigned area: ${j.route.replace('Illustrative ','')} only. ${j.property==='creek'?'All six floors in this demo.':'Follow the A–C or D–F building boundary shown in your job packet.'}</li><li>${icon('check')} Clear your own collection cart and leave the disposal staging area tidy.</li><li>${icon('info')} Bulk hauling, compactor repair, and unassigned buildings are outside this job.</li></ul></section><section class="panel pad"><div class="flex between section-title"><h3>Assigned floor plan</h3>${pill('Illustrative plan','gray')}</div>${floorMap(j)}<p class="note">${j.property!=='creek'?'Select each assigned building to see its two demo apartments per floor. ':''}No resident scan means “inspection required” under the current service policy.</p></section><section class="panel pad"><h3>What to bring</h3><ul class="list"><li>${icon('check')} Closed-toe footwear, work gloves, and a charged phone.</li><li>${icon('check')} A headlamp and a leak-resistant tote; demonstration cart available on site.</li><li>${icon('info')} This demo route uses on-site disposal. Real equipment and vehicle requirements must be verified per property.</li></ul></section></div><aside class="panel pad booking"><span class="eyebrow muted">FIXED ROUTE PAY · DEMO</span><div class="pay">$${j.pay}<small> / submitted route</small></div><div class="divider"></div><div class="summaryrow"><span class="muted">Service date</span><strong>${date(j.day)}</strong></div><div class="summaryrow"><span class="muted">Service window</span><strong>${windowLabel(j)}</strong></div><div class="summaryrow"><span class="muted">Expected work</span><strong>~${j.minutes} minutes</strong></div><p class="note">Reserve the full service window. A 15-minute buffer separates jobs at different properties. Pay stays fixed when scan volume changes.</p><div class="divider"></div>${reserved?`<div class="approved">${icon('check')} Reservation recorded.</div><button class="btn" data-action="packet" data-value="${j.id}">${s==='completed'?'View completion':'Open job packet'} ${icon('arrow')}</button>`:`<label class="check"><input id="accept" type="checkbox">I’ve reviewed the service window, equipment, and assigned area.</label>${!claimable(j)?'<p class="error">This route is not currently available for reservation.</p>':''}${conflicts(j)?'<p class="error">This window overlaps a reserved job or its travel buffer.</p>':''}<button class="btn" data-action="reserve" data-value="${j.id}" ${conflicts(j)||!claimable(j)?'disabled':''}>Reserve route ${icon('arrow')}</button><p class="note">Demo booking only. No actual assignment or payment is created.</p>`}</aside></div>`}
function schedule(){const mine=JOBS.filter(j=>state.bookings[j.id]),earned=mine.filter(j=>status(j.id)==='completed').reduce((s,j)=>s+j.pay,0);return `<div class="pagehead"><h1>My jobs</h1><p>Reserved routes, collection progress and submitted records.</p></div><div class="metrics"><div class="panel metric"><span>Upcoming routes</span><strong>${mine.filter(j=>status(j.id)==='reserved').length}</strong></div><div class="panel metric"><span>In progress</span><strong>${mine.filter(j=>status(j.id)==='active').length}</strong></div><div class="panel metric"><span>Submitted</span><strong>${mine.filter(j=>status(j.id)==='completed').length}</strong></div><div class="panel metric"><span>Submitted pay · demo</span><strong>$${earned}</strong></div></div><div class="stack">${mine.map(j=>`<article class="panel schedule-card"><div class="datebox"><span>Nov</span><b>${j.day}</b></div><div class="spacer">${pill(status(j.id)==='reserved'?'Reserved':status(j.id)==='active'?'In progress':'Submitted',status(j.id)==='active'?'blue':'')}<h3>${property(j).name}</h3><p>${j.route} · ${windowLabel(j)}</p></div><div style="text-align:right"><strong>$${j.pay}</strong><p>Fixed demo pay</p></div><button class="btn secondary" data-action="packet" data-value="${j.id}">${status(j.id)==='completed'?'View summary':'Open job packet'} ${icon('arrow')}</button></article>`).join('')||`<div class="panel empty">${icon('calendar')}<h3>No reserved jobs</h3><p>Reserve a route to get its arrival brief and collection plan.</p><button class="btn" data-action="nav" data-value="discover">Browse available jobs ${icon('arrow')}</button></div>`}</div>`}
function packet(j){const s=status(j.id),active=s==='active',done=s==='completed',count=completedCount(j.id),issues=issueCount(j.id);return `<button class="btn ghost back" data-action="nav" data-value="schedule">${icon('back')} My jobs</button><div class="pagehead"><div class="flex between wrap"><div><span class="eyebrow muted">YOUR JOB PACKET · ${date(j.day)}</span><h1 style="margin-top:7px">${property(j).name}</h1><p>${j.route} · ${windowLabel(j)}</p></div>${pill(done?'Submitted':active?'In progress':'Reserved',active?'blue':'')}</div></div>${done?`<div class="success-banner"><strong>${icon('check')} Route submitted</strong><p>${count} doors recorded · ${issues} ${issues===1?'exception':'exceptions'} flagged for supervisor follow-up · $${j.pay} submitted demo pay, not an actual payment.</p></div>`:''}<div class="detail-layout"><div class="stack"><section class="panel pad"><div class="flex between section-title"><h3>01 &nbsp; Property instructions</h3>${pill('Demo instructions','gray')}</div><div class="inline-info">${property(j).address} · Illustrative access details; do not use at a real property.</div><ul class="list"><li>${icon('pin')} <span><strong>Park & enter.</strong> Use the marked service bay at the east entrance. Follow the green signs to ${j.property==='creek'?'Building A’s elevator lobby':'the assigned building cluster'}.</span></li><li>${icon('shield')} <span><strong>Access.</strong> Demo access code: 2468#. Check in at the service entrance before entering resident areas.</span></li><li>${icon('truck')} <span><strong>Collect & dispose.</strong> Pick up the demo cart by the entrance. Return full loads to the north waste enclosure; do not operate or repair compactor machinery.</span></li><li>${icon('users')} <span><strong>Need help?</strong> Use “Report an issue” below to flag the route for the supervisor. This demo records the issue locally.</span></li></ul><div class="hint"><strong>Standard service: every assigned door gets checked.</strong>A missing scan means unknown, not empty. Only mark “No trash” after inspecting the doorstep.</div></section><section class="panel pad"><div class="flex between section-title"><h3>02 &nbsp; Floor plan</h3><span class="muted" style="font-size:11px">${j.kind} access</span></div>${floorMap(j)}</section><section class="panel pad" id="stop-list"><div class="flex between section-title"><h3>03 &nbsp; Stop records</h3><span class="muted">Floor ${floor}</span></div>${!active&&!done?'<div class="inline-info">Start the route during its service window to record pickups. You can review every floor now.</div>':''}${visibleStops(j).map(u=>`<div class="stop ${outcome(j.id,u)!=='pending'?'done':''}"><div class="stop-number">${outcome(j.id,u)==='collected'||outcome(j.id,u)==='empty'?'✓':u.slice(-2)}</div><div class="stop-info"><strong>Apartment ${u}</strong><small>${requested(j,u)?'Resident reported trash ready':'No scan · inspection required'}</small>${state.stopNotes[j.id]?.[u]?`<small class="issue-note">${esc(state.stopNotes[j.id][u].text)}</small>`:''}</div><label class="sr-only" for="stop-${u}">Outcome for apartment ${u}</label><select id="stop-${u}" data-stop="${u}" data-job="${j.id}" ${!active?'disabled':''}>${[['pending','Not visited'],['collected','Collected'],['empty','No trash'],['blocked','Blocked access'],['exception','Other exception']].map(([v,t])=>`<option value="${v}" ${outcome(j.id,u)===v?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}<p class="note">“No trash” records an inspection. “Blocked access” records an unresolved exception; it never counts as a successful pickup.</p></section></div><aside class="stack"><section class="panel pad"><h3>Route progress</h3><div class="flex between" style="margin:20px 0 8px"><strong>${count} / ${j.units}</strong><span class="muted" style="font-size:11px">doors recorded</span></div><progress value="${count}" max="${j.units}" aria-label="Doors recorded"></progress><div class="summaryrow"><span>Collected</span><strong>${Object.values(state.outcomes[j.id]||{}).filter(v=>v==='collected').length}</strong></div><div class="summaryrow"><span>No trash after inspection</span><strong>${Object.values(state.outcomes[j.id]||{}).filter(v=>v==='empty').length}</strong></div><div class="summaryrow"><span>Needs follow-up</span><strong style="color:${issues?'var(--orange)':'inherit'}">${issues}</strong></div>${done?`<div class="divider"></div><span class="eyebrow muted">COMPLETION NOTE</span><p style="font-size:12px;margin-top:8px">${esc(state.notes[j.id]||'No additional notes.')}</p><p class="note">Started: ${esc(state.bookings[j.id]?.startedAt||'—')}<br>Submitted: ${esc(state.completion[j.id]||'—')}</p>`:active?`<button class="btn" style="width:100%;margin-top:18px" data-action="finish" data-value="${j.id}" ${count<j.units?'disabled':''}>Review & submit ${icon('arrow')}</button><p class="note">Record all ${j.units} doors before submitting. Exceptions may be submitted for follow-up.</p><button class="btn secondary small" style="width:100%;margin-top:10px" data-action="issue" data-value="${j.id}">Report an issue</button>`:`<button class="btn" style="width:100%;margin-top:18px" data-action="start" data-value="${j.id}">Start route ${icon('arrow')}</button><p class="note">Starts ${date(j.day)} at ${fmt(j.start)}. Use the presenter’s “Advance time” control to move to the service window.</p><button class="btn ghost small" data-action="cancel" data-value="${j.id}" style="margin-top:10px">Release reservation</button>`}</section><div class="hint"><strong>Assigned scope</strong>Use the building and floor boundaries shown in this job. Report access problems against the affected apartment.</div>${active?`<div class="panel pad"><span class="eyebrow muted">PRESENTER SHORTCUT</span><p class="note">Simulate checks on all remaining doors. Existing exceptions stay unresolved. Demo shortcut; does not represent actual inspections.</p><button class="btn secondary small" data-action="simulate" data-value="${j.id}" style="margin-top:12px">Simulate remaining stops</button></div>`:''}</aside></div>`}
function operations(){const today=JOBS.filter(j=>j.day===state.opsDay),covered=today.filter(j=>status(j.id)!=='open'&&status(j.id)!=='unpublished'),issues=today.reduce((s,j)=>s+issueCount(j.id),0);return `<div class="pagehead"><div class="flex between wrap"><h1>Coverage and service records</h1>${pill('Supervisor workspace','blue')}</div><p>Review assignments, collection progress and unresolved exceptions by service date.</p></div><div class="metrics"><div class="panel metric"><span>Routes on this date</span><strong>${today.length}</strong></div><div class="panel metric"><span>Covered</span><strong>${covered.length}<small class="muted" style="font-size:18px"> / ${today.length}</small></strong></div><div class="panel metric"><span>Needs a collector</span><strong style="color:var(--orange)">${today.length-covered.length}</strong></div><div class="panel metric"><span>Unresolved door exceptions</span><strong>${issues}</strong></div></div>${state.opsDay===4&&!state.published?`<div class="panel hero"><div><span class="eyebrow">UNPUBLISHED ROUTE</span><h2>Building A has no assignment</h2><p>Publish the predefined route with its instructions and fixed demo pay. Approved collectors can claim the whole service window.</p></div><button class="btn light" data-action="publish">Publish route ${icon('arrow')}</button></div>`:''}<section class="panel" style="overflow:hidden"><div class="pad flex between"><h3>Route assignments</h3><label class="field">Service date<select id="ops-day"><option value="4" ${state.opsDay===4?'selected':''}>Wed, Nov 4</option><option value="5" ${state.opsDay===5?'selected':''}>Thu, Nov 5</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Property / route</th><th>Service window</th><th>Collector</th><th>Status</th><th>Doors recorded</th><th>Follow-up</th><th>Records</th></tr></thead><tbody>${today.map(j=>`<tr><td><strong>${property(j).name}</strong><small>${j.route}</small></td><td>${windowLabel(j)}</td><td>${state.bookings[j.id]?'Maya Chen':esc(state.otherAssignments?.[j.id]||'—')}</td><td>${pill(({open:claimable(j)?'Open to claim':'Booking closed',unpublished:'Unpublished',reserved:'Reserved',active:'In progress',completed:'Submitted'})[status(j.id)],status(j.id)==='open'||status(j.id)==='unpublished'?'amber':status(j.id)==='active'?'blue':'')}</td><td>${completedCount(j.id)} / ${j.units}</td><td>${issueCount(j.id)?pill(`${issueCount(j.id)} ${issueCount(j.id)===1?'exception':'exceptions'}`,'red'):'—'}</td><td><button class="btn secondary small" data-action="review-job" data-value="${j.id}">Review</button></td></tr>`).join('')}</tbody></table></div></section><div class="compare" style="margin-top:24px"><section class="panel pad"><h3 style="margin-bottom:20px">Activity log</h3><div class="activity">${state.events.length?state.events.slice(0,7).map(e=>`<div class="activity-item"><span class="dot"></span><div>${esc(e.message)}<small>${esc(e.time)}</small></div></div>`).join(''):'<p class="muted" style="font-size:12px">Route claims, starts, and service events will appear here.</p>'}</div></section><section class="panel pad"><h3>Route review</h3><p class="muted" style="font-size:13px;margin:12px 0">Each job is a predefined service area for one window. Building clusters can be staffed independently without overlapping assignments.</p><div class="hint"><strong>Exceptions remain visible.</strong>Submitting a route doesn’t erase blocked doors. Select Review to see the affected apartments, issue notes and submission record.</div>${today.filter(j=>state.notes[j.id]).map(j=>`<p class="note"><strong>${property(j).name}:</strong> ${esc(state.notes[j.id])}</p>`).join('')}</section></div>`}
function labRequests(){return state.labDemand==='all'?[101,201,301,401,501,601]:state.labDemand==='none'?[]:[201,202,501,504]}
function lab(){const req=labRequests(),floors=new Set(req.map(u=>Math.floor(u/100))),n=floors.size,standard=30+6*3+req.length*1.5,optimized=req.length?8+n*3+req.length*1.5:0,delta=standard-optimized;return `<div class="pagehead"><div class="flex between wrap"><h1>Service policy comparison</h1>${pill('Future policy scenario','amber')}</div><p>Compare required stops for standard service and a possible scan-required policy.</p></div><div class="panel pad" style="margin-bottom:22px"><div class="flex between wrap"><div><span class="eyebrow muted">ILLUSTRATIVE BUILDING A</span><h3 style="margin-top:5px">6 residential floors · 4 apartments per floor · 1 elevator</h3></div><label class="field">Pickup request distribution<select id="lab-demand"><option value="sparse" ${state.labDemand==='sparse'?'selected':''}>Requests on two floors</option><option value="all" ${state.labDemand==='all'?'selected':''}>Requests on every floor</option><option value="none" ${state.labDemand==='none'?'selected':''}>No pickup requests</option></select></label></div><p class="note">${req.length} on-time requests · cutoff 7:45 PM · service begins 8:00 PM · no actual property layout or customer policy is represented.</p></div>${state.late?`<div class="success-banner" style="background:#fff3df;border-color:#efdfbf;color:#8b6126"><strong>Late request received: Apartment 402 at 8:10 PM</strong><p>After the 7:45 PM cutoff. Standard service still inspects this floor. In the future-policy scenario, the request is queued for the next service; it does not silently change the agreed route.</p></div>`:''}<div class="compare">${[false,true].map(opt=>`<section class="panel pad ${opt?'recommended':''}"><div class="flex between">${pill(opt?'Proposed policy':'Standard service',opt?'':'gray')}${icon(opt?'bolt':'shield')}</div><h2 style="margin-top:15px">${opt?'Scan-required service':'Standard service'}</h2><p class="muted" style="font-size:12px;margin-top:7px">${opt?'Only where the property’s service agreement permits it.':'No scan means unknown. Every door still gets inspected.'}</p><div class="building">${Array.from({length:6},(_,i)=>{const f=i+1,has=floors.has(f),skip=opt&&!has;return `<div class="level ${skip?'skipped':has?'active':''}"><strong>F${f}</strong><span style="font-size:10px">${skip?'Not requested · not visited':has?'Pickup + '+(opt?'requested doors':'inspection'):'Inspection required'}</span><div class="miniunits">${[1,2,3,4].map(u=>`<span class="miniunit ${req.includes(f*100+u)?'request':''}" title="Apartment ${f*100+u}" aria-label="Apartment ${f*100+u}${req.includes(f*100+u)?', trash ready':''}"></span>`).join('')}</div></div>`}).join('')}</div><div class="compare-metrics"><div><strong>${opt?n:6}<small style="font-size:12px;color:var(--muted)"> / 6</small></strong><span>residential floors visited</span></div><div><strong>${opt?req.length:24}</strong><span>${opt?'requested doors':'doors inspected'}</span></div><div><strong>${opt?n:6}</strong><span>residential elevator stops</span></div><div><strong>${opt?optimized:standard} min</strong><span>illustrative effort estimate</span></div></div><div class="divider"></div><p class="muted" style="font-size:12px">${opt?(n?`Suggested sequence: entrance → ${[...floors].sort((a,b)=>b-a).map(f=>'F'+f).join(' → ')} → disposal.`:'No requested pickups. No collection visit in this simulation.'):'Sequence: entrance → F6 → F5 → F4 → F3 → F2 → F1 → disposal.'}</p></section>`).join('')}</div><div class="panel hero" style="margin-top:22px"><div><span class="eyebrow">MODEL OUTPUT</span><h2>${6-n} fewer floors visited in this scenario</h2><p>${n===6?'Both policies visit all floors. The modeled effort difference comes from the assumed door-inspection workload.':n===0?'A zero-request night only eliminates the visit if the contract has no other required inspection or on-site duties.':'Only requested floors appear in the proposed-policy sequence. Actual travel depends on the verified property layout.'}</p></div><div class="hero-stat"><strong>${Math.round(delta)} min</strong><span>modeled effort difference</span></div></div><details class="panel pad"><summary style="cursor:pointer;font-weight:600">Model assumptions</summary><div class="stack" style="gap:10px;margin-top:15px;font-size:12px;color:var(--muted)"><p>Standard: 30 minutes for arrival, disposal, walking, and all-door checks + 3 minutes per residential floor + 1.5 minutes per requested pickup. Future policy: 8 minutes fixed overhead + 3 minutes per visited floor + 1.5 minutes per requested pickup. With no requests, the future scenario assumes no mandatory site visit.</p><p>These are deliberately simple demonstration inputs, not measured property performance. Elevator waits, cart capacity, repeat disposal trips, late set-outs, and access constraints can materially change results. This is a suggested sequence, not an optimization engine.</p><p>A missed resident scan must still be collected during standard service. Scan-required collection is a separate future agreement. Timing between collection scans combines travel, handling, and delays; it is not a pure travel measurement.</p></div></details>`}
function render(){document.title='Fieldwork — '+(state.loggedIn?STORIES[state.story].title:'Welcome');document.getElementById('app').innerHTML=state.loggedIn?shell(selected?(state.view==='packet'?packet(job(selected)):detail(job(selected))):state.view==='ops'?operations():state.view==='schedule'?schedule():state.view==='lab'?lab():discover()):login()}

function setOutcome(id,unit,value){
 const previous=outcome(id,unit);(state.outcomes[id]??={})[unit]=value;
 (state.recordedAt[id]??={})[unit]=currentTime();
 if(previous!==value)event('Apartment '+unit+' on '+job(id).route+': '+previous+' → '+value+'.');
}
function exceptionList(id){const entries=allStops(job(id)).filter(u=>['blocked','exception'].includes(outcome(id,u)));return entries.length?`<ul class="list">${entries.map(u=>`<li><div><strong>Apartment ${u} · ${outcome(id,u)==='blocked'?'Blocked access':'Other exception'}</strong><br>${esc(state.stopNotes[id]?.[u]?.text||'No apartment note recorded.')}<br><small>${esc(state.stopNotes[id]?.[u]?.time||state.recordedAt[id]?.[u]||'')}</small></div></li>`).join('')}</ul>`:''}
function openIssue(id,unit,kind='blocked'){
 if(status(id)!=='active')return;
 const selectedUnit=unit||visibleStops(job(id))[0];
 modal('Record apartment issue',`<label class="field">Apartment<select id="issue-unit" data-job="${id}">${allStops(job(id)).map(u=>`<option ${u===selectedUnit?'selected':''}>${u}</option>`).join('')}</select></label><label class="field" style="margin-top:15px">Issue type<select id="issue-kind"><option value="blocked" ${kind==='blocked'?'selected':''}>Blocked access</option><option value="exception" ${kind==='exception'?'selected':''}>Other exception</option></select></label><label class="field" style="margin-top:15px">Issue note<textarea id="issue-note" maxlength="1000" rows="3" placeholder="Describe the problem and the follow-up needed.">${esc(state.stopNotes[id]?.[selectedUnit]?.text||'')}</textarea></label><p>The apartment remains unresolved until its outcome changes. The route completion note is stored separately.</p>`,`<button class="btn secondary" data-action="close-modal">Cancel</button><button class="btn" data-action="save-issue" data-value="${id}">Save issue</button>`);
}
function reviewJob(id){const j=job(id),b=state.bookings[id];modal('Route records',`<h3>${property(j).name}</h3><p>${j.route}<br>${date(j.day)} · ${windowLabel(j)}<br>Collector: ${b?'Maya Chen':esc(state.otherAssignments[id]||'Unassigned')}</p><div class="summaryrow"><span>Doors recorded</span><strong>${completedCount(id)} / ${j.units}</strong></div><div class="summaryrow"><span>Unresolved exceptions</span><strong>${issueCount(id)}</strong></div><p>Reserved: ${esc(b?.claimedAt||'—')}<br>Started: ${esc(b?.startedAt||'—')}<br>Submitted: ${esc(state.completion[id]||'—')}</p>${exceptionList(id)}<h3>Submission note</h3><p>${esc(state.notes[id]||'No submission note.')}</p><details><summary>All apartment outcomes</summary><ul class="list">${allStops(j).map(u=>`<li>${u}: ${esc(outcome(id,u))}${state.recordedAt[id]?.[u]?' · '+esc(state.recordedAt[id][u]):''}</li>`).join('')}</ul></details><p>Supervisor resolution and reassignment are not implemented in this demo.</p>`)}

// 5. User actions and explicit workflow transitions.
function modal(title,body,actions){modalReturnFocus=document.activeElement;document.getElementById('layers').innerHTML=`<div class="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="flex between"><h2 id="modal-title">${title}</h2><button class="btn ghost small" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${body}<div class="actions">${actions||'<button class="btn" data-action="close-modal">Got it</button>'}</div></section></div>`;const first=document.querySelector('.modal button');if(first)first.focus()}
function closeModal(){document.getElementById('layers').innerHTML='';if(modalReturnFocus?.isConnected)modalReturnFocus.focus()}
function loadStory(id){state={...baseState(),loggedIn:true,story:id,role:id==='coverage'?'operator':'collector',view:id==='coverage'?'ops':id==='routing'?'lab':'discover',published:id!=='coverage',otherAssignments:id==='coverage'?{t1:'Alex Rivera',r1:'Sam Patel'}:{}};if(id==='coverage')state.events=[{message:'Building A has no assigned collector for tonight’s service window.',time:currentTime()}];selected=null;floor=1;filterDay='all';filterArea='all';filterType='all';drawer=false;save();closeModal();render();window.scrollTo(0,0);toast('Scenario loaded: '+STORIES[id].title)}
function openPacket(id){if(!state.bookings[id]){toast('Reserve route before opening its job packet.');return}selected=id;state.view='packet';floor=1;save();render();window.scrollTo(0,0)}
function advance(){let target=selected?job(selected):JOBS.find(j=>state.bookings[j.id]&&status(j.id)==='active')||JOBS.find(j=>state.bookings[j.id]&&status(j.id)==='reserved')||JOBS[0];if(state.day<target.day||state.day===target.day&&state.time<target.start){state.day=target.day;state.time=target.start}else if(state.time<target.end){state.time=Math.min(state.time+15,target.end)}else{toast('At the end of the service window. Reset the story to replay.');return}save();render();toast('Demo clock: '+currentTime())}
function sources(){modal('Property sources and demo data',`<p>Fieldwork is an independent concept prepared for discussion with Butler Plus. It is not an official Butler Plus product.</p>${Object.values(PROPERTIES).map(p=>`<div style="margin:15px 0"><strong>${p.name}</strong><p style="margin:4px 0;font-size:12px">${p.verified} No Butler Plus customer relationship has been verified.</p><a href="${p.source}" target="_blank" rel="noopener noreferrer">View property source ↗</a></div>`).join('')}<p>All routes, floors, unit numbers, access codes, service windows, earnings, collector identities, and pickup events are fictional. Floor schematics are original illustrative drawings, not actual building plans. The map is not for navigation.</p><p>The clock is fixed to November 4–5, 2026, Eastern Time. Browser-local storage is the only persistence; no real authentication, messaging, payments, or shared booking is performed.</p><p><a href="https://trashbutler.com/cities/raleigh-durham" target="_blank" rel="noopener noreferrer">Butler Plus’s public RTP service information ↗</a></p>`)}
const actions={
'toolbar':()=>{toolbarVisible=!toolbarVisible;drawer=false;render()},'nav':v=>go(v),'detail':v=>{selected=v;floor=1;state.view='detail';save();render();window.scrollTo(0,0)},'packet':openPacket,'building':v=>{building=v;render()},'floor':v=>{floor=Number(v);render()},'unit':v=>{if(state.view==='packet'){document.getElementById('stop-'+v)?.focus()}else toast('Apartment '+v+': '+(requested(job(selected),v)?'trash reported ready.':'inspection required; no resident scan.'))},
'reserve':v=>{const j=job(v);if(!document.getElementById('accept')?.checked){toast('Please review and acknowledge the job requirements first.');document.getElementById('accept')?.focus();return}if(status(v)!=='open'||conflicts(j)){toast('This route is unavailable or overlaps your schedule.');return}if(!claimable(j)){toast('There is not enough time left in this window for the route estimate. Choose another job.');return}state.bookings[v]={status:'reserved',claimedAt:currentTime()};state.outcomes[v]={};event('Maya claimed '+property(j).name+' · '+j.route+'.');openPacket(v);toast('Reservation saved.')},
'start':v=>{const j=job(v);if(status(v)!=='reserved')return;if(state.day!==j.day||state.time<j.start||state.time>j.end-j.minutes){toast('Start with enough time remaining for the route estimate. Start during the service window. Use Advance time for the demo.');return}if(Object.values(state.bookings).some(b=>b.status==='active')){toast('Finish your active route before starting another.');return}state.bookings[v].status='active';state.bookings[v].startedAt=currentTime();event('Maya started '+property(j).name+' · '+j.route+'.');render();toast('Route started. Inspect every assigned door.')},
'cancel':v=>modal('Release this reservation?',`<p>The route returns to available work, and the supervisor can see the coverage gap. No actual assignment is affected.</p>`,`<button class="btn secondary" data-action="close-modal">Keep reservation</button><button class="btn" data-action="release" data-value="${v}">Release route</button>`),
'release':v=>{if(status(v)!=='reserved')return;delete state.bookings[v];delete state.outcomes[v];delete state.notes[v];delete state.stopNotes[v];delete state.recordedAt[v];delete state.completion[v];event('Maya released '+property(job(v)).name+' · '+job(v).route+'.');closeModal();go('schedule');toast('Reservation released.')},
'simulate':v=>{if(status(v)!=='active')return;for(const u of allStops(job(v)))if(outcome(v,u)==='pending')setOutcome(v,u,requested(job(v),u)?'collected':'empty');event('Demo simulation recorded the remaining doors on '+job(v).route+'; existing exceptions were preserved.');render();toast('Remaining inspections simulated. Review any exceptions before submitting.')},
'finish':v=>{if(status(v)!=='active'||completedCount(v)<job(v).units)return;modal('Review route submission',`<p>${completedCount(v)} doors recorded. ${issueCount(v)} unresolved ${issueCount(v)===1?'exception':'exceptions'} will remain on the supervisor’s board.</p>${exceptionList(v)}<label class="field">Completion note ${issueCount(v)?'(required for exceptions)':'(optional)'}<textarea id="completion-note" rows="4" maxlength="1000" placeholder="Add route-level context or follow-up instructions.">${esc(state.notes[v]||'')}</textarea></label><p>Submitting adds $${job(v).pay} to submitted demo pay. No payment is processed.</p>`,`<button class="btn secondary" data-action="close-modal">Keep reviewing</button><button class="btn" data-action="submit" data-value="${v}">Submit route</button>`)},
'submit':v=>{const note=document.getElementById('completion-note')?.value.trim()||'';if(issueCount(v)&&!note){toast('Add a note so the supervisor can follow up on exceptions.');document.getElementById('completion-note').focus();return}if(status(v)!=='active'||completedCount(v)<job(v).units)return;state.notes[v]=note;state.bookings[v].status='completed';state.completion[v]=currentTime();event('Maya submitted '+job(v).route+' with '+issueCount(v)+' unresolved '+(issueCount(v)===1?'exception.':'exceptions.'));closeModal();save();render();window.scrollTo(0,0)},
'issue':v=>openIssue(v),
'save-issue':v=>{const n=document.getElementById('issue-note').value.trim(),u=document.getElementById('issue-unit').value,kind=document.getElementById('issue-kind').value;if(!n){toast('Enter an issue note.');return}if(status(v)!=='active'||!allStops(job(v)).includes(u))return;setOutcome(v,u,kind);(state.stopNotes[v]??={})[u]={text:n,time:currentTime(),kind};event('Issue recorded at '+job(v).route+', apartment '+u+': '+n);closeModal();save();render();toast('Issue saved for apartment '+u+'.')},
'review-job':v=>reviewJob(v),
'publish':()=>{state.published=true;event('Building A was published to the approved collector pool.');render();toast('Route published. Switch to Collector to claim it.')},
'role':()=>{state.opsDay=state.day;state.role=state.role==='collector'?'operator':'collector';go(state.role==='operator'?'ops':Object.keys(state.bookings).length?'schedule':'discover');toast('Viewing as '+(state.role==='operator'?'Jordan, area supervisor.':'Maya, approved collector.'))},
'stories':()=>{drawer=!drawer;render()},'story':loadStory,'advance':advance,'reset':()=>modal('Reset this story?',`<p>Demo bookings, pickup records, earnings, and the clock will return to this story’s starting point.</p>`,`<button class="btn secondary" data-action="close-modal">Keep working</button><button class="btn" data-action="story" data-value="${state.story}">Reset story</button>`),
'inject':()=>{if(state.view==='lab'){state.late=true;state.day=4;state.time=1210;save();render();toast('A late request arrived from apartment 402.')}else{const j=selected&&status(selected)==='active'?job(selected):JOBS.find(j=>status(j.id)==='active');if(!j){toast('Start a reserved route first, then add an access issue.');return}const unit=allStops(j).find(u=>floorOf(u)===3);setOutcome(j.id,unit,'blocked');(state.stopNotes[j.id]??={})[unit]={text:'Locked access door. Supervisor follow-up requested.',time:currentTime(),kind:'blocked'};event('Access issue: apartment '+unit+' on '+j.route+' could not be reached.');floor=3;building=buildings(j)[0];save();render();toast('Access issue added at apartment '+unit+'. It stays visible until resolved.')}},
'sources':sources,'close-modal':closeModal,'clear-filters':()=>{filterDay='all';filterArea='all';filterType='all';render()},'logout':()=>{state.loggedIn=false;drawer=false;save();render()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;actions[b.dataset.action]?.(b.dataset.value)});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();state.loggedIn=true;save();render()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='issue-unit'){document.getElementById('issue-note').value=state.stopNotes[el.dataset.job]?.[el.value]?.text||'';}if(el.dataset.filter){if(el.dataset.filter==='day')filterDay=el.value;if(el.dataset.filter==='area')filterArea=el.value;if(el.dataset.filter==='type')filterType=el.value;render()}if(el.id==='ops-day'){state.opsDay=Number(el.value);save();render()}if(el.id==='lab-demand'){state.labDemand=el.value;save();render()}if(el.dataset.stop){const id=el.dataset.job,u=el.dataset.stop;if(status(id)!=='active')return;const next=el.value;if(next==='blocked'||next==='exception'){render();openIssue(id,u,next);return}setOutcome(id,u,next);save();const focusId=el.id;render();document.getElementById(focusId)?.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();if(drawer){drawer=false;render()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('svg [data-action]')){e.preventDefault();actions[e.target.dataset.action]?.(e.target.dataset.value)}if(e.key==='Tab'&&document.querySelector('.modal')){const list=[...document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal select,.modal a')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus()}}});
// Reload restores durable records; transient detail selection returns to a stable list.
if(['packet','detail'].includes(state.view))state.view=state.role==='operator'?'ops':'schedule';
render();
</script></body></html>
